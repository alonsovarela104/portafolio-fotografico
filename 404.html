<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0a09" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada | Alonso Varela</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html { background: #0b0a09; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 2rem;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #f3ede2; background: #0b0a09; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; }
    .kicker {
      font-size: .72rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
      color: #e2956f; margin-bottom: 1rem;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -.01em;
      font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; margin-bottom: 1rem;
    }
    p { color: rgba(243, 237, 226, .66); margin-bottom: 2rem; }
    a {
      display: inline-block; padding: .8rem 1.4rem; border-radius: 999px;
      background: #f3ede2; color: #0b0a09; font-weight: 500; font-size: .95rem; text-decoration: none;
    }
    a:hover { background: #fff; }
    a:focus-visible { outline: 2px solid #e2956f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker" style="margin-bottom:1rem">Error 404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no esté. Las fotos siguen en la página principal.</p>
    <a href="/">Volver a las fotos</a>
  </main>
</body>
</html>
